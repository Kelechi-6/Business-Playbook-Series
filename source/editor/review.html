<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Responsive layout review</title>
    <style>
      body {
        margin: 0;
        background: #cbd5d1;
        font: 14px Arial;
        color: #153442;
      }
      header {
        padding: 18px;
        display: flex;
        gap: 25px;
        align-items: center;
        background: white;
      }
      section {
        display: flex;
        gap: 25px;
        align-items: start;
        padding: 25px;
      }
      iframe {
        background: white;
        border: 1px solid #9baea6;
        flex-shrink: 0;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      .mobile {
        width: 390px;
        height: 844px;
      }
      .tablet {
        width: 768px;
        height: 1024px;
      }
      span {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Responsive review</h1>
      <span
        >Actual frame viewports: phone 390 × 844 and tablet 768 × 1024.
        Development-only view.</span
      >
      <nav>
        <a href="?page=home">Home</a> ·
        <a href="?page=catalogue">Catalogue</a> ·
        <a href="?page=book">Book</a> · <a href="?page=contact">Contact</a> ·
        <a href="?page=search">Search</a>
      </nav>
    </header>
    <section>
      <div>
        <p>Phone · 390 px</p>
        <iframe
          class="mobile"
          title="Phone layout"
          src="/__review/frame/"
        ></iframe>
      </div>
      <div>
        <p>Tablet · 768 px</p>
        <iframe
          class="tablet"
          title="Tablet layout"
          src="/__review/frame/"
        ></iframe>
      </div>
    </section>
  </body>
</html>
